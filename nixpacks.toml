# Only used if the Railway service builder is switched back to Nixpacks.
# The install phase is spelled out because relying on auto-detection is what
# produced an image with no dependencies in it.
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && python -c 'import uvicorn, fastapi, pandas, apscheduler, sqlalchemy, py5paisa'"
]

[phases.build]
cmds = ["echo 'no build step'"]

[start]
cmd = ". /opt/venv/bin/activate && python main.py"
